services:
  postgres:
    image: postgres:17-alpine
    container_name: maniarverse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maniarverse
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: maniarverse_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
